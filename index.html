<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Story RPG Engine - Supremacy Edition</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevents browser scrollbars from appearing */
      background: #0b0c10; 
      color: #c5c6c7; 
      font-family: 'Segoe UI', sans-serif; 
      text-align: center; 
    }
    #game-container { position: relative; width: 1000px; margin: 0 auto; }
    canvas { background: #1f2833; display: block; border: 4px solid #66fcf1; border-radius: 4px; image-rendering: pixelated; }
    
    #ui-bar {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(11, 12, 16, 0.85); padding: 8px 16px; border-radius: 6px;
      font-size: 13px; border: 1px solid #45a29e; pointer-events: none; z-index: 5;
    }
    .stat-highlight { color: #66fcf1; font-weight: bold; }
    .gold-highlight { color: #ffd700; font-weight: bold; }
    .xp-highlight { color: #ab47bc; font-weight: bold; }

    #skill-bar {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: rgba(11, 12, 16, 0.85);
      padding: 6px 12px; border-radius: 8px; border: 1px solid #45a29e; z-index: 5;
    }
    .skill-slot {
      width: 44px; height: 44px; background: #1f2833; border: 2px solid #66fcf1;
      border-radius: 4px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; font-weight: bold; font-size: 12px; position: relative; color: #66fcf1;
    }
    .cd-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); display: flex; justify-content: center;
      align-items: center; color: #ff4d4d; font-size: 14px; font-weight: bold;
    }

    #stat-window {
      display: none; position: absolute; top: 50px; left: 50px; width: 260px;
      background: rgba(11, 12, 16, 0.95); border: 2px solid #66fcf1;
      border-radius: 8px; padding: 15px; text-align: left; font-size: 13px; z-index: 10;
    }
    #stat-window h3 { margin: 0 0 10px 0; color: #66fcf1; }

    #dialogue-box {
      display: none; position: absolute; bottom: 70px; left: 50px; right: 50px;
      background: rgba(11, 12, 16, 0.95); border: 2px solid #66fcf1;
      border-radius: 8px; padding: 15px; text-align: left; z-index: 10;
    }
    #dialogue-name { font-weight: bold; color: #66fcf1; font-size: 15px; margin-bottom: 6px; }
    #dialogue-text { color: #edf2f4; font-size: 14px; line-height: 1.5; min-height: 42px; }

    #shop-box, #class-select-box {
      display: none; position: absolute; top: 40px; left: 200px; right: 200px;
      background: rgba(11, 12, 16, 0.95); border: 2px solid #ffd700;
      border-radius: 8px; padding: 20px; text-align: left; max-height: 320px; overflow-y: auto; z-index: 10;
    }
    .shop-item, .class-btn {
      display: flex; justify-content: space-between; align-items: center;
      background: #1f2833; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px; color: #fff;
    }
    .shop-btn, .class-btn {
      background: #66fcf1; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; color: #0b0c10;
    }
    .shop-btn:hover, .class-btn:hover { background: #45a29e; color: #fff; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div>Zone: <span id="zone-display" class="stat-highlight">Oakhaven Town</span></div>
      <div>Job: <span id="job-display" class="stat-highlight">Novice</span> | Lv: <span id="level-display" class="stat-highlight">1</span></div>
      <div>HP: <span id="hp-display" class="stat-highlight">100 / 100</span></div>
      <div>XP: <span id="xp-display" class="xp-highlight">0 / 50</span> | Gold: <span id="gold-display" class="gold-highlight">0</span></div>
      <div>Quest: <span id="quest-display" class="stat-highlight">Talk to Elder</span></div>
    </div>

    <div id="skill-bar">
      <div class="skill-slot">Q<span id="cd-q" class="cd-overlay" style="display:none;"></span></div>
      <div class="skill-slot">W<span id="cd-w" class="cd-overlay" style="display:none;"></span></div>
      <div class="skill-slot">E<span id="cd-e" class="cd-overlay" style="display:none;"></span></div>
      <div class="skill-slot" style="border-color: #ffd700;">R<span id="cd-r" class="cd-overlay" style="display:none;"></span></div>
    </div>

    <div id="stat-window">
      <h3>Character Stats [C]</h3>
      <div>Job: <span id="st-job" class="stat-highlight">Novice</span></div>
      <div>STR: <span id="st-str">5</span> | DEX: <span id="st-dex">5</span></div>
      <div>INT: <span id="st-int">5</span> | VIT: <span id="st-vit">5</span></div>
      <div>ATK: <span id="st-atk">12</span> | DEF: <span id="st-def">2</span></div>
      <hr style="border-color: #45a29e;">
      <div>Passive: <span id="st-passive" class="stat-highlight">None</span></div>
    </div>

    <div id="dialogue-box">
      <div id="dialogue-name">NPC Name</div>
      <div id="dialogue-text"></div>
    </div>

    <div id="shop-box">
      <h3 style="color:#66fcf1; margin-top:0;">Blacksmith's Armory</h3>
      <div class="shop-item"><span>Health Potion (+50 HP)</span><button class="shop-btn" onclick="buyItem('potion', 25)">Buy (25 G)</button></div>
      <div class="shop-item"><span>Iron Longsword (+8 ATK)</span><button class="shop-btn" onclick="buyItem('sword', 60)">Buy (60 G)</button></div>
      <button class="shop-btn" style="background:#c5c6c7; margin-top:10px;" onclick="closeShop()">Close [Esc]</button>
    </div>

    <div id="class-select-box">
      <h3 id="class-select-title" style="color:#ffd700; margin-top:0;">Select Your Job</h3>
      <div id="class-options"></div>
    </div>

    <canvas id="gameCanvas" width="1000" height="400"></canvas>
  </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Job System Trees
const BASE_JOBS = {
  "Warrior": { str: 15, dex: 8, int: 4, vit: 14, passive: "Rage: Attack scaling" },
  "Rogue": { str: 8, dex: 18, int: 6, vit: 8, passive: "Swiftness: Move speed" },
  "Tank": { str: 10, dex: 6, int: 4, vit: 20, passive: "Thorns: Defense boost" },
  "Mage": { str: 4, dex: 8, int: 20, vit: 6, passive: "Arcane: CD reduction" },
  "Archer": { str: 6, dex: 19, int: 7, vit: 7, passive: "Eagle Eye: Critical Chance" },
  "Priest": { str: 6, dex: 6, int: 16, vit: 12, passive: "Blessing: Passive HP regen" },
  "Bard": { str: 6, dex: 12, int: 14, vit: 8, passive: "Tempo: Attack speed" },
  "Druid": { str: 10, dex: 10, int: 12, vit: 12, passive: "Nature: Health scaling" },
  "Necromancer": { str: 5, dex: 7, int: 18, vit: 8, passive: "Soul Harvest: Lifesteal" },
  "Paladin": { str: 12, dex: 6, int: 10, vit: 16, passive: "Aegis: Armor scaling" }
};

const ADVANCED_JOBS = {
  "Warrior": ["Berserker", "Warlord", "Gladiator", "Dreadnought", "Champion"],
  "Rogue": ["Assassin", "Shadowblade", "Trickster", "Corsair", "Nightstalker"],
  "Tank": ["Juggernaut", "Guardian", "Bulwark", "Ironclad", "Colossus"],
  "Mage": ["Archmage", "Elementalist", "Chronomancer", "Arcanist", "Sorcerer"],
  "Archer": ["Sniper", "Ranger", "Sharpshooter", "Beastmaster", "Hawkeye"],
  "Priest": ["High Priest", "Inquisitor", "Monk", "Oracle", "Templar"],
  "Bard": ["Minstrel", "Troubadour", "Skald", "Siren", "Virtuoso"],
  "Druid": ["Shapeshifter", "Archdruid", "Stormcaller", "Wildkeeper", "Bramblemancer"],
  "Necromancer": ["Lich", "Lord of Bones", "Soulreaper", "Plaguebringer", "Deathknight"],
  "Paladin": ["Crusader", "Holy Avenger", "Sunbreaker", "Justicar", "Divine Shield"]
};

const SUPREMACY_PREFIXES = ["Omni", "Void", "Celestial", "Prime", "Eternal"];

function getSupremacyJobs(advancedJob) {
  return SUPREMACY_PREFIXES.map(p => `${p} ${advancedJob}`);
}

let currentZone = 0; // 0: Town, 1: Swamp, 2: Caverns, 3: Dragon's Peak

const ZONES = [
  { name: "Oakhaven Town", questReq: "Talk to Elder Eldrin", questState: "NOT_STARTED" },
  { name: "Whispering Swamp", questReq: "Defeat 3 Slimes", kills: 0, target: 3 },
  { name: "Ashen Caverns", questReq: "Defeat 3 Skeletons", kills: 0, target: 3 },
  { name: "Dragon's Peak", questReq: "Defeat the VOID TITAN", kills: 0, target: 1 }
];

const player = {
  x: 100, y: 220, width: 32, height: 40, speed: 3.5,
  hp: 100, maxHp: 100, level: 1, xp: 0, xpToNext: 50, maxLevel: 50,
  gold: 0, job: "Novice", baseJob: "", advancedJob: "",
  str: 5, dex: 5, int: 5, vit: 5, atk: 12, def: 2, passive: "None",
  isAttacking: false, attackCooldown: 0, attackTimer: 0, attackBox: { x: 0, y: 0, w: 36, h: 40 },
  facing: "right", walking: false, animFrame: 0, animTimer: 0,
  cooldowns: { Q: 0, W: 0, E: 0, R: 0 }, maxCooldowns: { Q: 120, W: 240, E: 360, R: 720 }
};

const projectiles = [];
const damageNumbers = [];
const particles = [];

const keys = {};
window.addEventListener("keydown", e => {
  // Prevent browser window from scrolling when pressing controls
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Space"].includes(e.key)) {
    e.preventDefault();
  }

  keys[e.key] = true;
  if (e.key === " " || e.key === "e" || e.key === "E") handleInteract();
  if (e.key === "j" || e.key === "J") handleMeleeAttack();
  if (e.key === "k" || e.key === "K") handleRangedAttack();
  if (e.key === "c" || e.key === "C") toggleStatWindow();
  if (["q","w","e","r"].includes(e.key.toLowerCase())) useSkill(e.key.toUpperCase());
  if (e.key === "Escape") closeShop();
});
window.addEventListener("keyup", e => keys[e.key] = false);

function spawnDamageNumber(x, y, amount, color = "#ff4d4d") {
  damageNumbers.push({ x, y, amount: Math.floor(amount), color, life: 40 });
}

function spawnSparkParticles(x, y, color = "#ffd700", count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      color, life: 15, size: Math.random() * 3 + 2
    });
  }
}

class Projectile {
  constructor(x, y, vx, vy, isEnemy, damage, color = "#66fcf1", zone = 0) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.isEnemy = isEnemy; this.damage = damage; this.color = color; this.alive = true;
    this.zone = zone;
  }
  update() {
    if (this.zone !== currentZone) { this.alive = false; return; }
    this.x += this.vx; this.y += this.vy;
    particles.push({ x: this.x, y: this.y, vx: (Math.random()-0.5), vy: (Math.random()-0.5), color: this.color, life: 8, size: 2 });
    if (this.x < 0 || this.x > 1000 || this.y < 0 || this.y > 400) this.alive = false;

    if (this.isEnemy) {
      const dist = Math.hypot((player.x + 16) - this.x, (player.y + 20) - this.y);
      if (dist < 20) {
        player.hp = Math.max(0, player.hp - Math.max(1, this.damage - player.def));
        spawnDamageNumber(player.x + 16, player.y, this.damage, "#ff0000");
        spawnSparkParticles(player.x + 16, player.y + 20, "#ff4d4d");
        this.alive = false; updateUI();
      }
    } else {
      mobs.filter(m => m.zone === currentZone).forEach(m => {
        if (m.alive) {
          const dist = Math.hypot((m.x + m.width / 2) - this.x, (m.y + m.height / 2) - this.y);
          if (dist < 20) {
            m.takeDamage(this.damage);
            spawnSparkParticles(m.x + m.width/2, m.y + m.height/2, this.color);
            this.alive = false;
          }
        }
      });
    }
  }
  draw(ctx) {
    ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fill();
  }
}

function addXP(amount) {
  if (player.level >= player.maxLevel) return;
  player.xp += amount;
  while (player.xp >= player.xpToNext && player.level < player.maxLevel) {
    player.xp -= player.xpToNext; player.level++;
    player.xpToNext = Math.floor(50 * Math.pow(1.3, player.level - 1));
    player.maxHp += 15 + player.vit; player.hp = player.maxHp; player.atk += 3;

    if (player.level === 10) promptBasicJobSelection();
    if (player.level === 25 && player.baseJob) promptAdvancedJobSelection();
    if (player.level === 40 && player.advancedJob) promptSupremacyJobSelection();
  }
  updateUI();
}

function promptBasicJobSelection() {
  const box = document.getElementById("class-select-box"); const opts = document.getElementById("class-options");
  document.getElementById("class-select-title").innerText = "Choose Base Job (Level 10)";
  opts.innerHTML = "";
  Object.keys(BASE_JOBS).forEach(jobKey => {
    const btn = document.createElement("button"); btn.className = "class-btn";
    btn.innerText = `${jobKey} (STR:${BASE_JOBS[jobKey].str} DEX:${BASE_JOBS[jobKey].dex} INT:${BASE_JOBS[jobKey].int})`;
    btn.onclick = () => selectJob(jobKey, "base"); opts.appendChild(btn);
  });
  box.style.display = "block";
}

function promptAdvancedJobSelection() {
  const box = document.getElementById("class-select-box"); const opts = document.getElementById("class-options");
  document.getElementById("class-select-title").innerText = "Choose Advanced Job (Level 25)";
  opts.innerHTML = "";
  ADVANCED_JOBS[player.baseJob].forEach(advName => {
    const btn = document.createElement("button"); btn.className = "class-btn";
    btn.innerText = `${advName} [Advanced ${player.baseJob}]`;
    btn.onclick = () => selectJob(advName, "advanced"); opts.appendChild(btn);
  });
  box.style.display = "block";
}

function promptSupremacyJobSelection() {
  const box = document.getElementById("class-select-box"); const opts = document.getElementById("class-options");
  document.getElementById("class-select-title").innerText = "Choose Supremacy Job (Level 40)";
  opts.innerHTML = "";
  const supremacyOptions = getSupremacyJobs(player.advancedJob);
  supremacyOptions.forEach(supName => {
    const btn = document.createElement("button"); btn.className = "class-btn";
    btn.innerText = `${supName} [Supremacy]`;
    btn.onclick = () => selectJob(supName, "supremacy"); opts.appendChild(btn);
  });
  box.style.display = "block";
}

function selectJob(jobName, tier) {
  if (tier === "base") {
    player.baseJob = jobName; player.job = jobName;
    const stats = BASE_JOBS[jobName];
    player.str = stats.str; player.dex = stats.dex; player.int = stats.int; player.vit = stats.vit; player.passive = stats.passive;
  } else if (tier === "advanced") {
    player.advancedJob = jobName; player.job = jobName;
    player.str += 12; player.dex += 12; player.int += 12; player.vit += 12;
  } else if (tier === "supremacy") {
    player.job = jobName;
    player.str += 25; player.dex += 25; player.int += 25; player.vit += 25;
    player.passive = `Supremacy Aura: ${jobName}`;
  }
  player.atk = player.str * 2 + player.dex; player.def = Math.floor(player.vit / 2);
  document.getElementById("class-select-box").style.display = "none"; updateUI();
}

function useSkill(key) {
  if (player.cooldowns[key] > 0) return;
  player.cooldowns[key] = player.maxCooldowns[key];
  player.isAttacking = true; player.attackTimer = 15;
  if (key === "Q") performAreaDamage(100, player.atk * 1.5, "#66fcf1");
  if (key === "W") performAreaDamage(160, player.atk * 2.2, "#ab47bc");
  if (key === "E") { player.hp = Math.min(player.maxHp, player.hp + 50); spawnDamageNumber(player.x + 16, player.y, 50, "#44ff44"); spawnSparkParticles(player.x + 16, player.y + 20, "#44ff44", 12); }
  if (key === "R") performAreaDamage(250, player.atk * 4.0, "#ffd700");
}

function performAreaDamage(range, damage, particleColor) {
  mobs.filter(mob => mob.zone === currentZone).forEach(mob => {
    const dist = Math.hypot((player.x + 16) - (mob.x + mob.width / 2), (player.y + 20) - (mob.y + mob.height / 2));
    if (dist <= range && mob.alive) {
      mob.takeDamage(damage);
      spawnSparkParticles(mob.x + mob.width / 2, mob.y + mob.height / 2, particleColor, 8);
    }
  });
}

function handleMeleeAttack() {
  if (player.attackCooldown > 0) return;
  player.isAttacking = true; player.attackTimer = 12; player.attackCooldown = 20;
  player.attackBox.x = player.facing === "right" ? player.x + player.width : player.x - player.attackBox.w;
  player.attackBox.y = player.y;

  mobs.filter(mob => mob.zone === currentZone).forEach(mob => {
    if (mob.alive && player.attackBox.x < mob.x + mob.width && player.attackBox.x + player.attackBox.w > mob.x &&
        player.attackBox.y < mob.y + mob.height && player.attackBox.y + player.attackBox.h > mob.y) {
      mob.takeDamage(player.atk);
      spawnSparkParticles(mob.x + mob.width / 2, mob.y + mob.height / 2, "#ffd700");
    }
  });
}

function handleRangedAttack() {
  if (player.attackCooldown > 0) return;
  player.attackCooldown = 25; player.isAttacking = true; player.attackTimer = 10;
  const speed = player.facing === "right" ? 7 : -7;
  projectiles.push(new Projectile(player.x + 16, player.y + 20, speed, 0, false, player.atk * 0.8, "#66fcf1", currentZone));
}

function drawDetailedSprite(ctx, x, y, type, facing = "right", animFrame = 0, isAttacking = false) {
  ctx.save();
  ctx.translate(x, y);

  if (type === "player") {
    const legOffset = (animFrame % 2 === 0) ? 0 : 3;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(16, 38, 12, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#1d3557";
    ctx.fillRect(8, 28 - legOffset, 6, 10 + legOffset);
    ctx.fillRect(18, 28 + legOffset, 6, 10 - legOffset);
    ctx.fillStyle = "#457b9d"; ctx.fillRect(6, 14, 20, 14);
    ctx.fillStyle = "#a8dadc"; ctx.fillRect(10, 16, 12, 10);
    ctx.fillStyle = "#f1faee"; ctx.fillRect(8, 2, 16, 12);
    ctx.fillStyle = "#e63946"; ctx.fillRect(6, 0, 20, 5);
    ctx.fillRect(facing === "right" ? 4 : 22, 2, 6, 10);
    ctx.fillStyle = "#1d3557";
    const eyeX = facing === "right" ? 18 : 10;
    ctx.fillRect(eyeX, 6, 3, 3);

    if (isAttacking) {
      ctx.strokeStyle = "#66fcf1"; ctx.lineWidth = 4;
      ctx.beginPath();
      if (facing === "right") {
        ctx.arc(28, 18, 20, -Math.PI / 3, Math.PI / 3);
      } else {
        ctx.arc(4, 18, 20, Math.PI * 2 / 3, Math.PI * 4 / 3);
      }
      ctx.stroke();
    }
  } 
  else if (type === "elder") {
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(16, 36, 10, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#4a148c"; ctx.fillRect(6, 10, 20, 26);
    ctx.fillStyle = "#ffd54f"; ctx.fillRect(10, 10, 12, 26);
    ctx.fillStyle = "#ffcc80"; ctx.fillRect(10, 4, 12, 8);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(8, 10, 16, 12);
  }
  else if (type === "smith") {
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(16, 36, 12, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#37474f"; ctx.fillRect(8, 14, 16, 22);
    ctx.fillStyle = "#bf360c"; ctx.fillRect(8, 18, 16, 14);
    ctx.fillStyle = "#ffcc80"; ctx.fillRect(10, 4, 12, 10);
    ctx.fillStyle = "#d84315"; ctx.fillRect(6, 14, 6, 10);
  }
  else if (type === "slime") {
    const pulse = Math.sin(animFrame * 0.2) * 2;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(16, 28, 14, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#2a9d8f"; ctx.beginPath(); ctx.ellipse(16, 20 + pulse/2, 14 + pulse, 10 - pulse, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e9c46a"; ctx.beginPath(); ctx.ellipse(14, 16 + pulse/2, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.fillRect(10, 16, 3, 4); ctx.fillRect(18, 16, 3, 4);
    ctx.fillStyle = "#000000"; ctx.fillRect(11, 17, 2, 2); ctx.fillRect(19, 17, 2, 2);
  }
  else if (type === "skeleton") {
    const bob = Math.sin(animFrame * 0.1) * 2;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(16, 36, 10, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#e0e0e0";
    ctx.fillRect(12, 4 + bob, 8, 8);
    ctx.fillRect(14, 12 + bob, 4, 14);
    ctx.fillRect(8, 14 + bob, 16, 3);
    ctx.fillRect(10, 26, 4, 10); ctx.fillRect(18, 26, 4, 10);
    ctx.fillStyle = "#000000"; ctx.fillRect(13, 6 + bob, 2, 2); ctx.fillRect(17, 6 + bob, 2, 2);
  }
  else if (type === "drake") {
    const wing = Math.sin(animFrame * 0.3) * 6;
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(16, 36, 14, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#d90429"; ctx.fillRect(8, 12, 16, 18);
    ctx.fillStyle = "#ef233c"; 
    ctx.beginPath(); ctx.moveTo(8, 14); ctx.lineTo(-4, 4 + wing); ctx.lineTo(8, 20); ctx.fill();
    ctx.beginPath(); ctx.moveTo(24, 14); ctx.lineTo(36, 4 + wing); ctx.lineTo(24, 20); ctx.fill();
    ctx.fillStyle = "#d90429"; ctx.fillRect(18, 6, 12, 8);
    ctx.fillStyle = "#ffb703"; ctx.fillRect(24, 8, 2, 2);
  }
  else if (type === "boss") {
    const floatY = Math.sin(animFrame * 0.08) * 4;
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.ellipse(24, 52, 24, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#2b2d42"; ctx.fillRect(4, 8 + floatY, 40, 40);
    ctx.fillStyle = "#8d99ae"; ctx.fillRect(10, 14 + floatY, 28, 28);
    ctx.fillStyle = "#d90429"; ctx.fillRect(18, 20 + floatY, 12, 12);
    ctx.fillStyle = "#ffb703"; ctx.fillRect(12, 12 + floatY, 6, 3); ctx.fillRect(30, 12 + floatY, 6, 3);
  }

  ctx.restore();
}

class NPC {
  constructor(name, spriteType, zone, x, y, getDialogue, onComplete) {
    this.name = name; this.spriteType = spriteType; this.zone = zone; this.x = x; this.y = y;
    this.getDialogue = getDialogue; this.onComplete = onComplete;
  }
  draw(ctx, tick) {
    if (this.zone !== currentZone) return;
    drawDetailedSprite(ctx, this.x, this.y, this.spriteType, "right", tick);
    ctx.fillStyle = "#66fcf1"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(this.name, this.x + 16, this.y - 8);
  }
}

const npcs = [
  new NPC("Elder Eldrin", "elder", 0, 180, 200, () => {
    if (ZONES[0].questState === "NOT_STARTED") return ["Defeat 3 Slimes in Whispering Swamp to clear the land!"];
    else return ["The portal to Whispering Swamp is open! Go forth!"];
  }, () => { 
    if (ZONES[0].questState === "NOT_STARTED") {
      ZONES[0].questState = "COMPLETED";
      updateUI();
    } 
  }),
  new NPC("Blacksmith Bruno", "smith", 0, 320, 260, () => ["Need upgrades for your journey?"], () => openShop())
];

class RespawningMob {
  constructor(name, spriteType, zone, minX, maxX, y, maxHp, atk, xpYield, goldYield, isRanged = false, isBoss = false) {
    this.name = name; this.spriteType = spriteType; this.zone = zone;
    this.minX = minX; this.maxX = maxX;
    this.x = minX + Math.random() * (maxX - minX - 40); this.y = y;
    this.width = isBoss ? 48 : 32; this.height = isBoss ? 48 : 40;
    this.maxHp = maxHp; this.hp = maxHp; this.atk = atk; this.xpYield = xpYield; this.goldYield = goldYield;
    this.isRanged = isRanged; this.isBoss = isBoss; this.alive = true; this.vx = 1.2; this.respawnTimer = 0; this.shootTimer = 0;
    this.animFrame = 0;
  }
  update() {
    if (this.zone !== currentZone) return; 
    if (!this.alive) {
      if (--this.respawnTimer <= 0) { this.alive = true; this.hp = this.maxHp; }
      return;
    }
    this.animFrame++;
    this.x += this.vx;
    if (this.x <= this.minX || this.x >= this.maxX - this.width) this.vx *= -1;

    if (this.isRanged && ++this.shootTimer > 110) {
      this.shootTimer = 0;
      const dir = player.x < this.x ? -4 : 4;
      projectiles.push(new Projectile(this.x + 16, this.y + 16, dir, 0, true, this.atk, "#ff0055", this.zone));
    }

    const dist = Math.hypot((player.x + 16) - (this.x + this.width / 2), (player.y + 20) - (this.y + this.height / 2));
    if (dist < 24) { player.hp = Math.max(0, player.hp - (this.atk * 0.03)); updateUI(); }
  }
  takeDamage(amount) {
    if (!this.alive) return;
    this.hp -= amount;
    spawnDamageNumber(this.x + 16, this.y, amount);
    if (this.hp <= 0) {
      this.alive = false; this.respawnTimer = 240;
      addXP(this.xpYield); player.gold += this.goldYield;
      
      const z = ZONES[this.zone];
      if (z && z.kills !== undefined && z.kills < z.target) {
        z.kills++;
        if (z.kills >= z.target) {
          z.questState = "COMPLETED";
        }
      }
      updateUI();
    }
  }
  draw(ctx, tick) {
    if (this.zone !== currentZone || !this.alive) return;
    const facing = this.vx > 0 ? "right" : "left";
    drawDetailedSprite(ctx, this.x, this.y, this.spriteType, facing, this.animFrame);
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(this.x, this.y - 12, this.width, 4);
    ctx.fillStyle = "#e63946"; ctx.fillRect(this.x, this.y - 12, (this.hp / this.maxHp) * this.width, 4);
  }
}

const mobs = [
  // Zone 1 (Swamp)
  new RespawningMob("Swamp Slime", "slime", 1, 100, 850, 150, 40, 6, 20, 15),
  new RespawningMob("Swamp Slime", "slime", 1, 100, 850, 220, 40, 6, 20, 15),
  new RespawningMob("Swamp Slime", "slime", 1, 100, 850, 290, 40, 6, 20, 15),
  new RespawningMob("Swamp Slime", "slime", 1, 100, 850, 340, 40, 6, 20, 15),

  // Zone 2 (Caverns)
  new RespawningMob("Cave Skeleton", "skeleton", 2, 100, 850, 160, 80, 12, 45, 30),
  new RespawningMob("Cave Skeleton", "skeleton", 2, 100, 850, 240, 80, 12, 45, 30),
  new RespawningMob("Cave Skeleton", "skeleton", 2, 100, 850, 320, 80, 12, 45, 30),
  new RespawningMob("Cave Drake", "drake", 2, 100, 850, 200, 110, 16, 60, 45, true),

  // Zone 3 (Dragon's Peak)
  new RespawningMob("VOID TITAN (BOSS)", "boss", 3, 400, 800, 180, 450, 28, 350, 300, true, true)
];

const dialogueUI = { box: document.getElementById("dialogue-box"), name: document.getElementById("dialogue-name"), text: document.getElementById("dialogue-text"), active: false, currentNPC: null };

function handleInteract() {
  if (dialogueUI.active) { dialogueUI.active = false; dialogueUI.box.style.display = "none"; if (dialogueUI.currentNPC.onComplete) dialogueUI.currentNPC.onComplete(); }
  else {
    npcs.filter(npc => npc.zone === currentZone).forEach(npc => {
      if (Math.hypot((player.x + 16) - (npc.x + 16), (player.y + 20) - (npc.y + 20)) < 50) {
        dialogueUI.active = true; dialogueUI.currentNPC = npc; dialogueUI.name.innerText = npc.name;
        dialogueUI.text.innerText = npc.getDialogue()[0]; dialogueUI.box.style.display = "block";
      }
    });
  }
}

function openShop() { document.getElementById("shop-box").style.display = "block"; }
function closeShop() { document.getElementById("shop-box").style.display = "none"; }
function toggleStatWindow() { const win = document.getElementById("stat-window"); win.style.display = win.style.display === "block" ? "none" : "block"; updateStatWindow(); }
function updateStatWindow() {
  document.getElementById("st-job").innerText = player.job; document.getElementById("st-str").innerText = player.str;
  document.getElementById("st-dex").innerText = player.dex; document.getElementById("st-int").innerText = player.int;
  document.getElementById("st-vit").innerText = player.vit; document.getElementById("st-atk").innerText = player.atk;
  document.getElementById("st-def").innerText = player.def; document.getElementById("st-passive").innerText = player.passive;
}
function buyItem(item, cost) {
  if (player.gold >= cost) {
    player.gold -= cost;
    if (item === "potion") player.hp = Math.min(player.maxHp, player.hp + 50);
    if (item === "sword") player.atk += 8;
    updateUI();
  } else alert("Not enough gold!");
}

function updateUI() {
  document.getElementById("hp-display").innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;
  document.getElementById("xp-display").innerText = `${player.xp} / ${player.xpToNext}`;
  document.getElementById("level-display").innerText = player.level;
  document.getElementById("gold-display").innerText = player.gold;
  document.getElementById("job-display").innerText = player.job;
  document.getElementById("zone-display").innerText = ZONES[currentZone].name;

  const z = ZONES[currentZone];
  if (z.questState === "COMPLETED") {
    document.getElementById("quest-display").innerText = "Portal Unlocked!";
  } else if (z.kills !== undefined) {
    document.getElementById("quest-display").innerText = `Kills: ${z.kills}/${z.target}`;
  } else {
    document.getElementById("quest-display").innerText = z.questReq;
  }
  updateStatWindow();
}

function update() {
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.attackTimer > 0) player.attackTimer--; else player.isAttacking = false;

  player.walking = false;
  if (!dialogueUI.active && document.getElementById("shop-box").style.display !== "block") {
    if (keys["ArrowRight"] || keys["d"]) { player.x += player.speed; player.facing = "right"; player.walking = true; }
    if (keys["ArrowLeft"] || keys["a"]) { player.x -= player.speed; player.facing = "left"; player.walking = true; }
    if (keys["ArrowUp"] || keys["w"]) { player.y -= player.speed; player.walking = true; }
    if (keys["ArrowDown"] || keys["s"]) { player.y += player.speed; player.walking = true; }
  }

  if (player.walking) {
    player.animTimer++;
    if (player.animTimer % 8 === 0) player.animFrame++;
  } else { player.animFrame = 0; }

  // Portal Interaction Check
  const portalUnlocked = ZONES[currentZone].questState === "COMPLETED";
  if (portalUnlocked && player.x > 930 && player.y > 150 && player.y < 250) {
    if (currentZone < ZONES.length - 1) {
      currentZone++;
      player.x = 50;
      player.y = 200;
      updateUI();
    }
  }

  // Prevents going off edges
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

  ["Q","W","E","R"].forEach(k => {
    if (player.cooldowns[k] > 0) {
      player.cooldowns[k]--; const overlay = document.getElementById(`cd-${k.toLowerCase()}`);
      overlay.style.display = "flex"; overlay.innerText = Math.ceil(player.cooldowns[k] / 60);
    } else document.getElementById(`cd-${k.toLowerCase()}`).style.display = "none";
  });

  mobs.forEach(m => m.update());
  projectiles.forEach((p, index) => { p.update(); if (!p.alive) projectiles.splice(index, 1); });
  particles.forEach((pt, index) => { pt.x += pt.vx; pt.y += pt.vy; pt.life--; if (pt.life <= 0) particles.splice(index, 1); });
  damageNumbers.forEach((d, index) => { d.y -= 0.5; d.life--; if (d.life <= 0) damageNumbers.splice(index, 1); });
}

function drawEnvironment(ctx, zone) {
  if (zone === 0) {
    // Village/Town graphics
    ctx.fillStyle = "#3a5a40"; ctx.fillRect(0, 0, 1000, 400); // Grass
    ctx.fillStyle = "#a3b18a"; ctx.fillRect(0, 180, 1000, 60); // Stone path
    
    // Houses
    drawHouse(ctx, 60, 40, "#7f5539", "#b08968");
    drawHouse(ctx, 300, 30, "#582f0e", "#7f5539");
    drawHouse(ctx, 550, 40, "#3d0c02", "#9a8c98");
    drawHouse(ctx, 750, 240, "#582f0e", "#b08968");
  } else if (zone === 1) {
    // Swamp terrain
    ctx.fillStyle = "#1b4332"; ctx.fillRect(0, 0, 1000, 400);
    // Muddy pools / water
    ctx.fillStyle = "#2d6a4f";
    ctx.beginPath(); ctx.ellipse(250, 120, 120, 60, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(700, 280, 180, 80, 0, 0, Math.PI*2); ctx.fill();
    // Lily pads
    ctx.fillStyle = "#52b788";
    ctx.beginPath(); ctx.arc(220, 110, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(720, 270, 16, 0, Math.PI*2); ctx.fill();
  } else if (zone === 2) {
    // Caverns
    ctx.fillStyle = "#212529"; ctx.fillRect(0, 0, 1000, 400);
    ctx.fillStyle = "#343a40";
    // Rocks
    for(let i=0; i<10; i++) {
      ctx.fillRect((i*110)%950, (i*70)%330, 40, 30);
    }
  } else if (zone === 3) {
    // Volcanic / Dragon Peak
    ctx.fillStyle = "#10002b"; ctx.fillRect(0, 0, 1000, 400);
    // Lava streams
    ctx.fillStyle = "#d90429";
    ctx.fillRect(0, 80, 1000, 30);
    ctx.fillRect(0, 300, 1000, 40);
  }

  // Draw Portal at Right Edge if Zone Quest Completed
  const portalUnlocked = ZONES[zone].questState === "COMPLETED";
  if (portalUnlocked && zone < ZONES.length - 1) {
    const pX = 940, pY = 160;
    ctx.fillStyle = "rgba(102, 252, 241, 0.3)";
    ctx.beginPath(); ctx.ellipse(pX + 20, pY + 40, 25, 45, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#66fcf1"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(pX + 20, pY + 40, 18 + Math.sin(tick*0.1)*3, 35 + Math.sin(tick*0.1)*3, 0, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = "#66fcf1"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("PORTAL", pX + 20, pY - 10);
  }
}

function drawHouse(ctx, x, y, wallColor, roofColor) {
  ctx.fillStyle = wallColor; ctx.fillRect(x, y + 40, 100, 70);
  ctx.fillStyle = roofColor; ctx.beginPath(); ctx.moveTo(x - 10, y + 40); ctx.lineTo(x + 50, y); ctx.lineTo(x + 110, y + 40); ctx.fill();
  ctx.fillStyle = "#212529"; ctx.fillRect(x + 38, y + 75, 24, 35); // Door
  ctx.fillStyle = "#ffb703"; ctx.fillRect(x + 15, y + 55, 18, 18); ctx.fillRect(x + 67, y + 55, 18, 18); // Windows
}

let tick = 0;
function draw() {
  tick++; ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  drawEnvironment(ctx, currentZone);

  npcs.forEach(npc => npc.draw(ctx, tick));
  mobs.forEach(m => m.draw(ctx, tick));
  projectiles.forEach(p => p.draw(ctx));

  drawDetailedSprite(ctx, player.x, player.y, "player", player.facing, player.animFrame, player.isAttacking);

  particles.forEach(pt => {
    ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
  });

  damageNumbers.forEach(d => {
    ctx.fillStyle = d.color; ctx.font = "bold 13px sans-serif"; ctx.fillText(d.amount, d.x, d.y);
  });
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
