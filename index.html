<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Story RPG Engine with Quests & Shop</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    #game-container { position: relative; width: 800px; margin: 20px auto; }
    canvas { background: #222; display: block; border: 4px solid #444; }
    
    #ui-bar {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between;
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 8px;
      font-size: 14px; pointer-events: none;
    }
    .gold-text { color: #ffd700; font-weight: bold; }
    
    /* Dialogue Overlay */
    #dialogue-box {
      display: none; position: absolute; bottom: 20px; left: 40px; right: 40px;
      background: rgba(20, 20, 35, 0.95); border: 3px solid #ffb703;
      border-radius: 8px; padding: 15px; text-align: left;
    }
    #dialogue-name { font-weight: bold; color: #ffb703; font-size: 16px; margin-bottom: 5px; }
    #dialogue-text { color: #edf2f4; font-size: 14px; line-height: 1.4; min-height: 40px; }
    #dialogue-hint { font-size: 11px; color: #8d99ae; margin-top: 5px; text-align: right; }

    /* Shop UI */
    #shop-box {
      display: none; position: absolute; top: 50px; left: 150px; right: 150px;
      background: rgba(25, 25, 40, 0.95); border: 3px solid #e63946;
      border-radius: 8px; padding: 20px; text-align: left;
    }
    #shop-title { font-weight: bold; color: #e63946; font-size: 18px; margin-bottom: 15px; }
    .shop-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #2b2d42; padding: 8px 12px; margin-bottom: 8px; border-radius: 4px;
    }
    .shop-btn {
      background: #ffb703; border: none; padding: 6px 12px;
      font-weight: bold; cursor: pointer; border-radius: 4px;
    }
    .shop-btn:hover { background: #ffa000; }
    #close-shop { margin-top: 10px; background: #6c757d; color: #fff; }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="ui-bar">
      <div>Zone: <span id="zone-display">Oakhaven Town</span></div>
      <div>Gold: <span id="gold-display" class="gold-text">0</span> | Quest: <span id="quest-display">Talk to Elder</span></div>
    </div>
    
    <div id="dialogue-box">
      <div id="dialogue-name">NPC Name</div>
      <div id="dialogue-text"></div>
      <div id="dialogue-hint">Press [Space] or [E] to continue...</div>
    </div>

    <div id="shop-box">
      <div id="shop-title">Bruno's Blacksmith Shop</div>
      <div class="shop-item">
        <span>Health Potion (+50 HP)</span>
        <button class="shop-btn" onclick="buyItem('potion', 20)">Buy (20 Gold)</button>
      </div>
      <div class="shop-item">
        <span>Steel Sword (+10 ATK)</span>
        <button class="shop-btn" onclick="buyItem('sword', 50)">Buy (50 Gold)</button>
      </div>
      <button class="shop-btn" id="close-shop" onclick="closeShop()">Close Shop [Esc]</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gameState = {
  gold: 0,
  questState: "NOT_STARTED", // NOT_STARTED, ACTIVE, COMPLETED
  inventory: []
};

const keys = {};
window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === " " || e.key === "e" || e.key === "E") handleInteract();
  if (e.key === "Escape") closeShop();
});
window.addEventListener("keyup", e => keys[e.key] = false);

const player = { x: 100, y: 180, width: 32, height: 32, speed: 4 };

// Typewriter Dialogue Engine
const dialogueUI = {
  box: document.getElementById("dialogue-box"),
  name: document.getElementById("dialogue-name"),
  text: document.getElementById("dialogue-text"),
  active: false,
  currentNPC: null,
  lineIndex: 0,
  fullText: "",
  charIndex: 0,
  isTyping: false,
  timer: null
};

function startTypewriter(text) {
  dialogueUI.fullText = text;
  dialogueUI.text.innerText = "";
  dialogueUI.charIndex = 0;
  dialogueUI.isTyping = true;
  clearInterval(dialogueUI.timer);

  dialogueUI.timer = setInterval(() => {
    if (dialogueUI.charIndex < dialogueUI.fullText.length) {
      dialogueUI.text.innerText += dialogueUI.fullText.charAt(dialogueUI.charIndex);
      dialogueUI.charIndex++;
    } else {
      dialogueUI.isTyping = false;
      clearInterval(dialogueUI.timer);
    }
  }, 25);
}

function completeTypewriterImmediately() {
  clearInterval(dialogueUI.timer);
  dialogueUI.text.innerText = dialogueUI.fullText;
  dialogueUI.isTyping = false;
}

// NPC & Quest Setup
class NPC {
  constructor(name, x, y, color, getDialogue, onComplete) {
    this.name = name;
    this.x = x; this.y = y;
    this.width = 32; this.height = 32;
    this.color = color;
    this.getDialogue = getDialogue;
    this.onComplete = onComplete;
  }

  draw(ctx) {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.fillStyle = "#fff";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(this.name, this.x + 16, this.y - 8);

    const dist = Math.hypot((player.x + 16) - (this.x + 16), (player.y + 16) - (this.y + 16));
    if (dist < 50 && !dialogueUI.active) {
      ctx.fillStyle = "#ffb703";
      ctx.font = "bold 10px sans-serif";
      ctx.fillText("[E] Talk", this.x + 16, this.y - 22);
    }
  }
}

const npcs = [
  new NPC("Elder Eldrin", 60, 100, "#9d4edd", () => {
    if (gameState.questState === "NOT_STARTED") {
      return [
        "Greetings adventurer! A dangerous Forest Slime is blocking the passage.",
        "Defeat the slime in the Whispering Woods, and I will open the gate to Zone 2!"
      ];
    } else if (gameState.questState === "ACTIVE") {
      return ["The Forest Slime is still alive! Go defeat it in Zone 1."];
    } else {
      return ["Thank you for slaying the monster! The path to Zone 2 is clear."];
    }
  }, () => {
    if (gameState.questState === "NOT_STARTED") {
      gameState.questState = "ACTIVE";
      document.getElementById("quest-display").innerText = "Defeat Forest Slime";
    }
  }),
  new NPC("Blacksmith Bruno", 150, 250, "#e63946", () => [
    "Welcome to my forge! Take a look at my items."
  ], () => {
    openShop();
  })
];

// Monster & Combat Drops
class ZoneMonster {
  constructor(name, x, y, minX, maxX, color, isTarget) {
    this.name = name;
    this.x = x; this.y = y;
    this.minX = minX; this.maxX = maxX;
    this.color = color; this.vx = 1.5;
    this.isTarget = isTarget;
    this.alive = true;
  }

  update() {
    if (!this.alive) return;
    this.x += this.vx;
    if (this.x <= this.minX || this.x >= this.maxX - 32) this.vx *= -1;

    // Defeat Monster on Touch (Simple Action Collision)
    const dist = Math.hypot((player.x + 16) - (this.x + 16), (player.y + 16) - (this.y + 16));
    if (dist < 30) {
      this.alive = false;
      gameState.gold += 30;
      document.getElementById("gold-display").innerText = gameState.gold;

      if (this.isTarget && gameState.questState === "ACTIVE") {
        gameState.questState = "COMPLETED";
        document.getElementById("quest-display").innerText = "Quest Completed!";
      }
    }
  }

  draw(ctx, tick) {
    if (!this.alive) return;
    const bounce = Math.sin(tick * 0.1) * 4;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y + bounce, 32, 32 - bounce);
    ctx.fillStyle = "#fff";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(this.name, this.x + 16, this.y - 8);
  }
}

const monsters = [
  new ZoneMonster("Forest Slime", 350, 180, 250, 500, "#44ff44", true),
  new ZoneMonster("Cave Skeleton", 650, 180, 520, 780, "#cccccc", false)
];

// Dialogue Interactivity
function handleInteract() {
  if (dialogueUI.active) {
    if (dialogueUI.isTyping) {
      completeTypewriterImmediately();
    } else {
      dialogueUI.lineIndex++;
      const lines = dialogueUI.currentNPC.getDialogue();
      if (dialogueUI.lineIndex < lines.length) {
        startTypewriter(lines[dialogueUI.lineIndex]);
      } else {
        dialogueUI.active = false;
        dialogueUI.box.style.display = "none";
        if (dialogueUI.currentNPC.onComplete) dialogueUI.currentNPC.onComplete();
      }
    }
  } else {
    npcs.forEach(npc => {
      const dist = Math.hypot((player.x + 16) - (npc.x + 16), (player.y + 16) - (npc.y + 16));
      if (dist < 50) {
        dialogueUI.active = true;
        dialogueUI.currentNPC = npc;
        dialogueUI.lineIndex = 0;
        dialogueUI.name.innerText = npc.name;
        dialogueUI.box.style.display = "block";
        startTypewriter(npc.getDialogue()[0]);
      }
    });
  }
}

// Shop System Logic
function openShop() { document.getElementById("shop-box").style.display = "block"; }
function closeShop() { document.getElementById("shop-box").style.display = "none"; }

function buyItem(item, cost) {
  if (gameState.gold >= cost) {
    gameState.gold -= cost;
    gameState.inventory.push(item);
    document.getElementById("gold-display").innerText = gameState.gold;
    alert(`Bought ${item}!`);
  } else {
    alert("Not enough gold!");
  }
}

function update() {
  if (!dialogueUI.active && document.getElementById("shop-box").style.display !== "block") {
    if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;
    if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
    if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
    if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;
  }

  // Zone 2 Barrier Enforcement based on Quest State
  if (gameState.questState !== "COMPLETED" && player.x > 500 - player.width) {
    player.x = 500 - player.width; // Block player from entering Zone 2
  }

  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

  monsters.forEach(m => m.update());

  const zoneDisplay = document.getElementById("zone-display");
  if (player.x < 220) zoneDisplay.innerText = "Oakhaven Town";
  else if (player.x < 500) zoneDisplay.innerText = "Whispering Woods (Zone 1)";
  else zoneDisplay.innerText = "Ashen Caverns (Zone 2)";
}

let tick = 0;
function draw() {
  tick++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background Zones
  ctx.fillStyle = "#3a5a40"; ctx.fillRect(0, 0, 220, 400);
  ctx.fillStyle = "#1b4332"; ctx.fillRect(220, 0, 280, 400);
  ctx.fillStyle = "#2b2d42"; ctx.fillRect(500, 0, 300, 400);

  // Zone 2 Barrier Wall (Locked state)
  if (gameState.questState !== "COMPLETED") {
    ctx.fillStyle = "rgba(230, 57, 70, 0.5)";
    ctx.fillRect(496, 0, 8, 400);
  }

  npcs.forEach(npc => npc.draw(ctx));
  monsters.forEach(m => m.draw(ctx, tick));

  // Player
  const walkCycle = dialogueUI.active ? 0 : Math.abs(Math.sin(tick * 0.15)) * 6;
  ctx.fillStyle = "#ffb703";
  ctx.fillRect(player.x, player.y - walkCycle, player.width, player.height);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
